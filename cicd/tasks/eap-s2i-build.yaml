# =============================================================================
# Tekton Task — EAP S2I Build
#
# Multi-stage build using Red Hat's official EAP 8 builder and runtime images.
# Uses Buildah (not Docker) — rootless, daemonless, OCI-compliant.
# =============================================================================
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: eap-s2i-build
  labels:
    app.kubernetes.io/name: eap-demo
    app.kubernetes.io/component: cicd
spec:
  params:
    - name: IMAGE
      type: string
      description: Fully qualified image name including tag
    - name: BUILDER_IMAGE
      type: string
      default: registry.redhat.io/jboss-eap-8/eap8-openjdk21-builder-openshift-rhel9:latest
    - name: RUNTIME_IMAGE
      type: string
      default: registry.redhat.io/jboss-eap-8/eap8-openjdk21-runtime-openshift-rhel9:latest
    - name: CONTEXT_DIR
      type: string
      default: "."
    - name: MAVEN_ARGS_APPEND
      type: string
      default: "-Popenshift"
    - name: TLSVERIFY
      type: string
      default: "true"

  workspaces:
    - name: source

  results:
    - name: IMAGE_DIGEST
      description: Digest of the built image

  steps:
    - name: generate-containerfile
      image: registry.redhat.io/ubi9/ubi-minimal:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        cat > $(workspaces.source.path)/Containerfile.generated <<'CONTAINERFILE'
        # Stage 1: Build
        FROM $(params.BUILDER_IMAGE) AS builder
        COPY --chown=185 $(params.CONTEXT_DIR) /tmp/src
        USER 185
        ENV MAVEN_ARGS_APPEND="$(params.MAVEN_ARGS_APPEND)"
        RUN /usr/local/s2i/assemble

        # Stage 2: Runtime
        FROM $(params.RUNTIME_IMAGE)
        COPY --from=builder /opt/server $JBOSS_HOME
        USER 185
        CMD /opt/eap/bin/openshift-launch.sh
        CONTAINERFILE

    - name: build-and-push
      image: registry.redhat.io/rhel9/buildah:latest
      securityContext:
        capabilities:
          add:
            - SETFCAP
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        cd $(workspaces.source.path)

        buildah bud \
          --storage-driver=vfs \
          --tls-verify=$(params.TLSVERIFY) \
          --layers \
          -f Containerfile.generated \
          -t $(params.IMAGE) \
          .

        buildah push \
          --storage-driver=vfs \
          --tls-verify=$(params.TLSVERIFY) \
          --digestfile /tmp/image-digest \
          $(params.IMAGE)

        cat /tmp/image-digest | tee $(results.IMAGE_DIGEST.path)
      volumeMounts:
        - name: varlibcontainers
          mountPath: /var/lib/containers

  volumes:
    - name: varlibcontainers
      emptyDir: {}
