# Development environment overrides
replicas: 1

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

storage:
  size: 512Mi
  storageClassName: ""

route:
  tls:
    termination: edge

monitoring:
  enabled: false

postgresql:
  persistence:
    size: 1Gi
    storageClass: ""
