# =============================================================================
# Default values for eap-demo Helm chart
# =============================================================================

# -- Application image (built by S2I or Tekton pipeline)
# Use the full internal registry path so pods don't resolve to docker.io.
# Format: image-registry.openshift-image-registry.svc:5000/<namespace>/<imagestream>
image:
  registry: image-registry.openshift-image-registry.svc:5000
  namespace: eap-demo
  name: eap-demo
  tag: latest

# -- S2I Build configuration
build:
  enabled: true
  git:
    uri: https://github.com/your-org/eap-demo.git
    ref: main
    contextDir: application
  s2i:
    builderImage: jboss-eap8-openjdk21-openshift:latest
    mavenArgs: "-Popenshift"

# -- Number of EAP replicas
replicas: 2

# -- Resource requests and limits
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1Gi

# -- EAP Operator (WildFlyServer) settings
operator:
  sessionAffinity: true
  disableHTTPRoute: false

# -- JGroups clustering
clustering:
  protocol: kubernetes.KUBE_PING
  labels: "app.kubernetes.io/name=eap-demo"

# -- JVM options appended to JAVA_OPTS
javaOptsAppend: >-
  -XX:+UseG1GC
  -XX:MaxGCPauseMillis=200

# -- Transaction log volume
storage:
  enabled: true
  size: 1Gi
  storageClassName: gp3-csi

# -- Database configuration
database:
  secretName: eap-demo-db
  host: postgresql
  port: 5432
  name: eapdemodb
  username: ""
  password: ""

# -- OpenShift Route
route:
  enabled: true
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# -- Monitoring via ServiceMonitor (requires user-workload-monitoring)
monitoring:
  enabled: true
  interval: 30s
  path: /metrics

# -- PostgreSQL (uses Red Hat official RHEL9 image)
postgresql:
  enabled: true
  image: registry.redhat.io/rhel9/postgresql-15:latest
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  persistence:
    size: 5Gi
    storageClass: gp3-csi
