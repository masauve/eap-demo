apiVersion: v1
kind: Secret
metadata:
  name: eap-demo-db
  labels:
    app.kubernetes.io/name: eap-demo
    app.kubernetes.io/component: database
type: Opaque
stringData:
  host: postgresql
  port: "5432"
  database: eapdemodb
  username: ""
  password: ""
